name: Android Auth Validation APK

on:
  push:
    branches:
      - fix/android-auth-critical
    paths:
      - ".github/workflows/android-test-apk.yml"
      - "mobile/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_AUTH_GOOGLE_ENABLED: ${{ vars.EXPO_PUBLIC_AUTH_GOOGLE_ENABLED || 'false' }}
      EXPO_PUBLIC_AUTH_FACEBOOK_ENABLED: ${{ vars.EXPO_PUBLIC_AUTH_FACEBOOK_ENABLED || 'false' }}
      EXPO_PUBLIC_NOAH_API_URL: https://bibliolingo-noah.vinicius-liniker1.workers.dev
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar tipos
        run: npm run typecheck

      - name: Executar testes
        run: npm test

      - name: Validar configuração real do Supabase
        shell: bash
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::Configure a variável EXPO_PUBLIC_SUPABASE_URL em Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure o secret EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY com a chave publishable/anon atual do mesmo projeto Supabase."
            exit 1
          fi
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            https://*) ;;
            *)
              echo "::error::EXPO_PUBLIC_SUPABASE_URL precisa usar HTTPS."
              exit 1
              ;;
          esac
          STATUS="$(curl --silent --show-error --output /tmp/auth-settings.json --write-out "%{http_code}"             "$EXPO_PUBLIC_SUPABASE_URL/auth/v1/settings"             --header "apikey: $EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::O Supabase rejeitou a URL/chave configurada (HTTP $STATUS). Nenhuma APK defeituosa será publicada."
            exit 1
          fi
          echo "Configuração Supabase validada pelo servidor (HTTP 200)."


      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compilar APK release de teste
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Preparar artefato
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/*.apk apk-output/Bibliolingo-auth-validation.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bibliolingo-auth-validation-${{ github.sha }}
          path: mobile/apk-output/Bibliolingo-auth-validation.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publicar APK em release pública
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="auth-critical-android-${{ github.run_number }}"
          gh release create "$TAG"             apk-output/Bibliolingo-auth-validation.apk#Bibliolingo-auth-validation.apk             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --title "Bibliolingo Android — validação de autenticação ${{ github.run_number }}"             --notes "APK de validação da correção crítica de autenticação. Não publicar em loja."             --prerelease
