name: Android Test APK
# Compatibility build: mobile artwork is loaded only after optimization.

on:
  push:
    branches:
      - feature/bibliolingo-mobile-full-parity
      - fix/mobile-performance-phase-2a
      - rebuild/mobile-complete-stable
      - feature/lumi-interactive-journey
      - fix/latest-mobile-auth-avatar
      - fix/mobile-auth-sync-lumi-final
    paths:
      - ".github/workflows/android-test-apk.yml"
      - "mobile/**"
      - "src/**"
      - "design-assets/**"
      - "assets/lumi/skins/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_AUTH_GOOGLE_ENABLED: "true"
      EXPO_PUBLIC_AUTH_FACEBOOK_ENABLED: "true"
      EXPO_PUBLIC_NOAH_API_URL: https://bibliolingo-noah.vinicius-liniker1.workers.dev
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar sprites oficiais da Lumi
        working-directory: .
        run: node scripts/validate-lumi-skins.mjs

      - name: Validar Web
        working-directory: .
        run: |
          npm install --no-audit --no-fund
          npx vitest run src
          npm run build

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar tipos
        run: npm run typecheck

      - name: Executar testes
        run: npm test

      - name: Validar provedores sociais habilitados
        shell: bash
        run: |
          test "$EXPO_PUBLIC_AUTH_GOOGLE_ENABLED" = "true"
          test "$EXPO_PUBLIC_AUTH_FACEBOOK_ENABLED" = "true"
          echo "Google e Facebook incluídos no APK."

      - name: Validar configuração real do Supabase
        shell: bash
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure a URL e a chave pública do Supabase no GitHub Actions."
            exit 1
          fi
          STATUS="$(curl --silent --show-error --output /tmp/auth-settings.json --write-out "%{http_code}"             "$EXPO_PUBLIC_SUPABASE_URL/auth/v1/settings"             --header "apikey: $EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::O Supabase rejeitou a URL/chave (HTTP $STATUS)."
            exit 1
          fi
          echo "Supabase validado pelo servidor (HTTP 200)."
          node - <<'NODE'
          const fs = require("fs");
          const settings = JSON.parse(fs.readFileSync("/tmp/auth-settings.json", "utf8"));
          const external = settings.external ?? {};
          if (external.google !== true) {
            console.error("::error::O provedor Google ainda está desabilitado no Supabase Auth.");
            process.exitCode = 1;
          }
          if (external.facebook !== true) {
            console.error("::error::O provedor Facebook ainda está desabilitado no Supabase Auth.");
            process.exitCode = 1;
          }
          console.log("Provedores externos:", JSON.stringify({ google: external.google, facebook: external.facebook }));
          NODE

      - name: Otimizar assets para Android
        run: |
          npm install --no-save --no-audit --no-fund sharp@0.34.4
          node scripts/optimize-assets.mjs

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compilar APK release de teste
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Preparar artefato
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/*.apk apk-output/Bibliolingo-release.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bibliolingo-release-${{ github.sha }}
          path: mobile/apk-output/Bibliolingo-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publicar APK em release pública
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bibliolingo-lumi-store-${{ github.run_number }}"
          gh release create "$TAG" \
            apk-output/Bibliolingo-release.apk#Bibliolingo-Lumi-Store.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Bibliolingo — Foto e Loja Lumi ${{ github.run_number }}" \
            --notes "Build integrada de autenticação, sincronização de conta e Loja Lumi. Requer as migrations 202610160001 e 202610260001 até 202610270004 no backend. Commit: ${{ github.sha }}." \
            --prerelease
