name: Android Test APK
# Compatibility build: mobile artwork is loaded only after optimization.

on:
  push:
    branches:
      - feature/bibliolingo-mobile-full-parity
    paths:
      - ".github/workflows/android-test-apk.yml"
      - "mobile/**"
      - "src/**"
      - "design-assets/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://bldjisxjhkxljblzpmru.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_i1JvS5Jdwn7ypxzz3SoLBg_iC8fkhMS' }}
      EXPO_PUBLIC_AUTH_WEB_URL: https://viniciusliniker1-spec.github.io/Bibliolingo/#/account
      EXPO_PUBLIC_AUTH_GOOGLE_ENABLED: ${{ vars.EXPO_PUBLIC_AUTH_GOOGLE_ENABLED || 'true' }}
      EXPO_PUBLIC_AUTH_FACEBOOK_ENABLED: ${{ vars.EXPO_PUBLIC_AUTH_FACEBOOK_ENABLED || 'true' }}
      EXPO_PUBLIC_NOAH_API_URL: https://bibliolingo-noah.vinicius-liniker1.workers.dev
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Otimizar assets para Android
        run: |
          npm install --no-save --no-audit --no-fund sharp@0.34.4
          node scripts/optimize-assets.mjs

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compilar APK release de teste
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Preparar artefato
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/*.apk apk-output/Bibliolingo-release.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bibliolingo-release-${{ github.sha }}
          path: mobile/apk-output/Bibliolingo-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
