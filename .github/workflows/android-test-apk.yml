name: Android Test APK
# Compatibility build: mobile artwork is loaded only after optimization.
# Production signing verification: permanent Android credentials are required when configured.

on:
  push:
    branches:
      - feature/bibliolingo-mobile-full-parity
      - fix/mobile-performance-phase-2a
      - rebuild/mobile-complete-stable
      - feature/lumi-interactive-journey
      - fix/latest-mobile-auth-avatar
      - fix/mobile-auth-sync-lumi-final
    paths:
      - ".github/workflows/android-test-apk.yml"
      - "mobile/**"
      - "src/**"
      - "design-assets/**"
      - "assets/lumi/skins/**"
      - "supabase/**"
  workflow_dispatch:

concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lumi-purchase-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci-only-password
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Criar banco descartável com migrations reais
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/lumi_test_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160001_auth_sync.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610260001_lumi_store_profile_photo.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610270001_lumi_official_skins.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610270002_lumi_rewards_photo.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610270003_lumi_reconciliation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610270004_account_state_sync.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610280001_account_progress_snapshot.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/account_progress_snapshot.sql
      - name: Reproduzir falha anterior e validar correção SQL
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/lumi_purchase_before_fix.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610280002_lumi_purchase_atomic_fix.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/lumi_purchase_after_fix.sql
          python supabase/tests/lumi_purchase_concurrency.py

  build-apk:
    needs: lumi-purchase-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_AUTH_GOOGLE_ENABLED: "true"
      EXPO_PUBLIC_AUTH_FACEBOOK_ENABLED: "false"
      EXPO_PUBLIC_NOAH_API_URL: https://bibliolingo-noah.vinicius-liniker1.workers.dev
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar sprites oficiais da Lumi
        working-directory: .
        run: node scripts/validate-lumi-skins.mjs

      - name: Validar Web
        working-directory: .
        run: |
          npm install --no-audit --no-fund
          npx vitest run src
          npm run build

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar tipos
        run: npm run typecheck

      - name: Executar testes
        run: npm test

      - name: Validar provedores sociais habilitados
        shell: bash
        run: |
          test "$EXPO_PUBLIC_AUTH_GOOGLE_ENABLED" = "true"
          test "$EXPO_PUBLIC_AUTH_FACEBOOK_ENABLED" = "false"
          echo "Google incluído no APK; Facebook removido da experiência."

      - name: Validar configuração real do Supabase
        shell: bash
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure a URL e a chave pública do Supabase no GitHub Actions."
            exit 1
          fi
          STATUS="$(curl --silent --show-error --output /tmp/auth-settings.json --write-out "%{http_code}"             "$EXPO_PUBLIC_SUPABASE_URL/auth/v1/settings"             --header "apikey: $EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::O Supabase rejeitou a URL/chave (HTTP $STATUS)."
            exit 1
          fi
          echo "Supabase validado pelo servidor (HTTP 200)."
          node - <<'NODE'
          const fs = require("fs");
          const settings = JSON.parse(fs.readFileSync("/tmp/auth-settings.json", "utf8"));
          const external = settings.external ?? {};
          if (external.google !== true) {
            console.error("::error::O provedor Google ainda está desabilitado no Supabase Auth.");
            process.exitCode = 1;
          }
          console.log("Provedores externos:", JSON.stringify({ google: external.google, facebookRemovedFromApp: true }));
          NODE

      - name: Otimizar assets para Android
        run: |
          npm install --no-save --no-audit --no-fund sharp@0.34.4
          node scripts/optimize-assets.mjs

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verificar retorno OAuth no Android gerado
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("android/app/src/main/AndroidManifest.xml").getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          activities = root.findall("./application/activity")
          main = next(a for a in activities if a.get(ns + "name", "").endswith("MainActivity"))
          assert main.get(ns + "exported") == "true", "MainActivity precisa receber o retorno externo"
          assert main.get(ns + "launchMode") == "singleTask", "O retorno deve reutilizar a Activity"
          filters = main.findall("intent-filter")
          assert any(
              any(d.get(ns + "scheme") == "bibliolingo" for d in f.findall("data"))
              and any(a.get(ns + "name") == "android.intent.action.VIEW" for a in f.findall("action"))
              and any(c.get(ns + "name") == "android.intent.category.BROWSABLE" for c in f.findall("category"))
              and any(c.get(ns + "name") == "android.intent.category.DEFAULT" for c in f.findall("category"))
              for f in filters
          ), "Falta intent-filter para bibliolingo://auth/callback"
          print("Manifesto Android: callback bibliolingo registrado; MainActivity singleTask/exported.")
          PY

      - name: Definir versão Android instalável
        shell: bash
        run: |
          BUILD_FILE="android/app/build.gradle"
          test -f "$BUILD_FILE"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" "$BUILD_FILE"
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"0.1.${{ github.run_number }}\"/" "$BUILD_FILE"
          grep -E "versionCode|versionName" "$BUILD_FILE"

      - name: Compilar APK release de teste
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Preparar, assinar e validar APK instalável
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$SOURCE_APK"
          test -f "android/app/debug.keystore"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"

          configured=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo "::error::A assinatura permanente está parcialmente configurada. Configure os quatro secrets Android."
            exit 1
          fi

          mkdir -p apk-output
          if [ "$configured" -eq 4 ]; then
            SIGNING_STORE="android/app/bibliolingo-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE"
            SIGNING_ALIAS="$ANDROID_KEY_ALIAS"
            SIGNING_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            SIGNING_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            BIBLIOLINGO_SIGNING_MODE="production"
          else
            SIGNING_STORE="android/app/debug.keystore"
            SIGNING_ALIAS="androiddebugkey"
            SIGNING_STORE_PASSWORD="android"
            SIGNING_KEY_PASSWORD="android"
            BIBLIOLINGO_SIGNING_MODE="test"
          fi
          export SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD
          echo "BIBLIOLINGO_SIGNING_MODE=$BIBLIOLINGO_SIGNING_MODE" >> "$GITHUB_ENV"

          unzip -t "$SOURCE_APK"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$SOURCE_APK" apk-output/Bibliolingo-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$SIGNING_STORE" \
            --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out apk-output/Bibliolingo-release.apk \
            apk-output/Bibliolingo-aligned.apk
          rm apk-output/Bibliolingo-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs apk-output/Bibliolingo-release.apk
          "$BUILD_TOOLS/aapt" dump badging apk-output/Bibliolingo-release.apk | tee apk-output/package-info.txt
          grep -F "package: name='com.bibliolingo.app'" apk-output/package-info.txt
          unzip -t apk-output/Bibliolingo-release.apk
          sha256sum apk-output/Bibliolingo-release.apk | tee apk-output/Bibliolingo-release.apk.sha256
          stat --printf='APK bytes: %s\n' apk-output/Bibliolingo-release.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bibliolingo-release-${{ github.sha }}
          path: mobile/apk-output/Bibliolingo-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publicar APK em release pública
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bibliolingo-lumi-store-${{ github.run_number }}"
          gh release create "$TAG" \
            apk-output/Bibliolingo-release.apk#Bibliolingo-Lumi-Store.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Bibliolingo — Google e compras Lumi ${{ github.run_number }}" \
            --notes "Sincronização automática de progresso por conta. Assinatura: $BIBLIOLINGO_SIGNING_MODE. Requer as migrations 202610160001, 202610260001 até 202610270004 e 202610280001 e 202610280002 no backend. Commit: ${{ github.sha }}." \
            --prerelease
