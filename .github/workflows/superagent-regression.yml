name: Superagent regression sandbox
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/superagent-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Repeat regression tests three times
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "::group::Test pass $attempt"
            npm test
            echo "::endgroup::"
          done
      - name: Typecheck and production build
        run: npm run build
