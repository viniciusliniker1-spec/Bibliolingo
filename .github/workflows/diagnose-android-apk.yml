name: Diagnose Android APK

on:
  push:
    branches:
      - feature/bibliolingo-mobile-full-parity
    paths:
      - ".github/workflows/diagnose-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar APK produzido
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39432995628 --name Bibliolingo-release-10052122491ff2fcf5cd4b994627c940b8cba7b8 --dir diagnostic-apk

      - name: Executar em Android limpo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r diagnostic-apk/Bibliolingo-release.apk
            adb logcat -c
            adb shell am force-stop com.bibliolingo.app
            adb shell monkey -p com.bibliolingo.app -c android.intent.category.LAUNCHER 1
            START_MS=$(date +%s%3N)
            for attempt in $(seq 1 60); do
              if adb logcat -d -v brief | grep -q 'ReactNativeJS.*Running "main"'; then
                END_MS=$(date +%s%3N)
                echo "STARTUP_MS=$((END_MS-START_MS))" | tee android-startup-metric.txt
                break
              fi
              sleep 1
            done
            sleep 3
            adb exec-out screencap -p > android-startup.png
            adb logcat -d -v threadtime > android-startup.log
            adb shell dumpsys activity activities > android-activity.txt
            grep -E "FATAL EXCEPTION|ReactNativeJS|AndroidRuntime|Expo|bibliolingo" android-startup.log | tail -n 500 > android-relevant.log || true

      - name: Publicar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bibliolingo-android-startup-diagnostic
          path: |
            android-startup.png
            android-startup.log
            android-relevant.log
            android-activity.txt
            android-startup-metric.txt
          if-no-files-found: warn
          retention-days: 7
