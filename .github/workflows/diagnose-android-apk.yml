name: Diagnose Android APK

on:
  push:
    branches:
      - feature/bibliolingo-mobile-full-parity
    paths:
      - ".github/workflows/diagnose-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar APK produzido
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39359139586 --name Bibliolingo-preview-041ff879dc2196e5a81a5e303e9d74d27559bc3d --dir diagnostic-apk

      - name: Executar em Android limpo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r diagnostic-apk/Bibliolingo-preview.apk
            adb logcat -c
            adb shell am force-stop com.bibliolingo.app
            adb shell monkey -p com.bibliolingo.app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > android-startup.png
            adb logcat -d -v threadtime > android-startup.log
            adb shell dumpsys activity activities > android-activity.txt
            grep -E "FATAL EXCEPTION|ReactNativeJS|AndroidRuntime|Expo|bibliolingo" android-startup.log | tail -n 500 > android-relevant.log || true

      - name: Publicar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bibliolingo-android-startup-diagnostic
          path: |
            android-startup.png
            android-startup.log
            android-relevant.log
            android-activity.txt
          if-no-files-found: warn
          retention-days: 7
