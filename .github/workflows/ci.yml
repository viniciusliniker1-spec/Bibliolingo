name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect dependency lock
        id: lockfile
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install locked dependencies
        if: steps.lockfile.outputs.exists == 'true'
        run: npm ci

      - name: Create initial dependency lock
        if: steps.lockfile.outputs.exists == 'false'
        run: npm install

      - name: Audit high-severity vulnerabilities
        run: npm audit --audit-level=high

      - run: npm test
      - run: npm run build

      - name: Persist initial lockfile
        if: github.event_name == 'push' && steps.lockfile.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add dependency lockfile"
          git push

  report-web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Phase 3 and 4 Web deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID=$(gh run list --repo viniciusliniker1-spec/Bibliolingo --workflow pages.yml --branch feature/bibliolingo-mobile-full-parity --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == env.TARGET_SHA) | .databaseId" | head -n1)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 5
          done
          test -n "$RUN_ID"
          echo "WEB_DEPLOY_RUN_ID=$RUN_ID"
          gh run watch "$RUN_ID" --repo viniciusliniker1-spec/Bibliolingo --exit-status --interval 15
          gh run view "$RUN_ID" --repo viniciusliniker1-spec/Bibliolingo --json status,conclusion,url --jq '.status + " " + .conclusion + " " + .url'
