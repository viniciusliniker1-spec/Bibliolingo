name: Devocional diário

# Gera o devocional do dia com o Gemini (plano gratuito) e publica o JSON em mobile/public/devotionals.
# Atenção: o GitHub só executa agendamentos (schedule) a partir do branch padrão. Este arquivo precisa
# estar no branch padrão (main) para rodar sozinho; o devocional é gravado em CONTENT_BRANCH.

on:
  schedule:
    - cron: "17 8 * * *" # 05:17 em Brasília
  workflow_dispatch:
    inputs:
      date:
        description: "Data (AAAA-MM-DD). Vazio = hoje em Brasília."
        required: false
      branch:
        description: "Branch onde gravar o devocional."
        required: false

permissions:
  contents: write

concurrency:
  group: daily-devotional
  cancel-in-progress: false

env:
  # Branch que o site da Vercel publica. Mude aqui se a produção mudar de branch.
  CONTENT_BRANCH: ${{ inputs.branch || vars.DEVOTIONAL_BRANCH || 'feature/bible-study-workspace-v1' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar devocional
        working-directory: mobile
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.DEVOTIONAL_GEMINI_MODEL }}
          DEVOTIONAL_DATE: ${{ inputs.date }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo "::error::Segredo GEMINI_API_KEY ausente"; exit 1; }
          node scripts/generate-devotional.mjs $DEVOTIONAL_DATE

      - name: Publicar
        run: |
          if [ -z "$(git status --porcelain mobile/public/devotionals)" ]; then
            echo "Nada novo para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/public/devotionals
          git commit -m "chore: devocional do dia"
          git push origin "HEAD:${CONTENT_BRANCH}"
