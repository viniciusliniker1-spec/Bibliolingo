name: Auth Sync Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/validate-supabase.mjs"
      - ".github/workflows/auth-smoke.yml"
      - "supabase/**"
  push:
    branches: [main]
    paths:
      - "scripts/validate-supabase.mjs"
      - ".github/workflows/auth-smoke.yml"
      - "supabase/**"

permissions:
  contents: read

jobs:
  validate:
    name: validate-supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar Auth, Data API e RLS
        run: node scripts/validate-supabase.mjs
