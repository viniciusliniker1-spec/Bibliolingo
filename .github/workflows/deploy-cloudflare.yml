name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bibliolingo-noah-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate protected configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_KV_NAMESPACE_ID"
          test -n "$GROQ_API_KEY"

      - name: Prepare ephemeral KV binding
        shell: bash
        working-directory: worker
        env:
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          cp wrangler.toml wrangler.deploy.toml
          sed -i "s|__CLOUDFLARE_KV_NAMESPACE_ID__|$CLOUDFLARE_KV_NAMESPACE_ID|g" wrangler.deploy.toml
          if grep -q "__CLOUDFLARE_KV_NAMESPACE_ID__" wrangler.deploy.toml; then
            exit 1
          fi

      - name: Deploy Worker and Groq secret
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.deploy.toml
          secrets: |
            GROQ_API_KEY
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Publish deployment summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          echo "### Bibliolingo Noah" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker publicado com binding KV e segredo Groq protegido." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "URL pública: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure essa URL na variável VITE_NOAH_API_URL do GitHub Actions para o próximo build do Pages." >> "$GITHUB_STEP_SUMMARY"
          fi
