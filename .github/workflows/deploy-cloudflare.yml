name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bibliolingo-noah-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate protected configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_KV_NAMESPACE_ID"
          test -n "$GROQ_API_KEY"

      - name: Verify Groq credential and select an available model
        id: groq
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          models="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            https://api.groq.com/openai/v1/models)"
          model="$(MODELS="$models" node -e '
            const available = new Set(JSON.parse(process.env.MODELS).data?.map((item) => item.id) ?? []);
            const preferred = [
              "llama-3.1-8b-instant",
              "openai/gpt-oss-20b",
              "meta-llama/llama-4-scout-17b-16e-instruct",
              "qwen/qwen3-32b"
            ];
            const selected = preferred.find((id) => available.has(id)) ??
              [...available].find((id) => /llama|qwen|gemma|gpt-oss/i.test(id) && !/guard|safety|whisper/i.test(id));
            if (!selected) process.exit(1);
            process.stdout.write(selected);
          ')"
          test -n "$model"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: Prepare ephemeral KV binding
        shell: bash
        working-directory: worker
        env:
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          GROQ_MODEL: ${{ steps.groq.outputs.model }}
        run: |
          cp wrangler.toml wrangler.deploy.toml
          sed -i "s|__CLOUDFLARE_KV_NAMESPACE_ID__|$CLOUDFLARE_KV_NAMESPACE_ID|g" wrangler.deploy.toml
          sed -i -E 's|^GROQ_MODEL = ".*"$|GROQ_MODEL = "'"$GROQ_MODEL"'"|' wrangler.deploy.toml
          if grep -q "__CLOUDFLARE_KV_NAMESPACE_ID__" wrangler.deploy.toml; then
            exit 1
          fi

      - name: Deploy Worker and Groq secret
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.149.0"
          command: deploy --config wrangler.deploy.toml
          secrets: |
            GROQ_API_KEY
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Verify health and Groq integration
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error "$DEPLOYMENT_URL/health" > /dev/null
          response="$(curl --silent --show-error \
            -X POST "$DEPLOYMENT_URL/v1/tutor" \
            -H "Origin: https://viniciusliniker1-spec.github.io" \
            -H "Content-Type: application/json" \
            --data '{"question":"Em uma frase, explique por que o contexto importa no estudo bíblico.","mode":"simple","level":"beginner","installationId":"github-deploy-smoke-test","context":{"area":"bible","title":"Verificação automática do Noah"}}')"
          RESPONSE="$response" node -e 'const value=JSON.parse(process.env.RESPONSE); if(!value.answer || value.provider!=="groq") { console.error(value.error ?? "invalid-response", value.message ?? ""); process.exit(1) }'

      - name: Evaluate biblical and theological behavior
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[content-eval]')
        env:
          NOAH_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: node .github/scripts/evaluate-noah.mjs

      - name: Publish deployment summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          echo "### Bibliolingo Noah" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker publicado com binding KV e segredo Groq protegido." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "URL pública: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure essa URL na variável VITE_NOAH_API_URL do GitHub Actions para o próximo build do Pages." >> "$GITHUB_STEP_SUMMARY"
          fi
